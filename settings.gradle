include ':TMessagesProj'
include ':Mokagram'
if (providers.gradleProperty('telegramUpstreamApps').orNull == 'true') {
    include ':TMessagesProj_App', ':TMessagesProj_AppHuawei', ':TMessagesProj_AppHockeyApp'
    include ':TMessagesProj_AppStandalone', ':TMessagesProj_AppTests'
}
include ':jlatexmath'
project(':jlatexmath').projectDir = file('TMessagesProj/lib/jlatexmath/jlatexmath')

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

gradle.ext.androidxMediaModulePrefix = 'TMessagesProj_Modules:media3:media-'
apply from: file("TMessagesProj_Modules/media/core_settings.gradle")